# Device Management Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-management
  namespace: iot-monitoring
  labels:
    app: device-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-management
  template:
    metadata:
      labels:
        app: device-management
    spec:
      containers:
      - name: device-management
        image: iot-monitoring-microservices-device-management:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: SERVER_DB
          value: "db"
        - name: NAME_DB
          value: "db_devices"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: USER_DB
          value: "admin"
        - name: PASSWORD_DB
          value: "1234"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: device-management
  namespace: iot-monitoring
spec:
  selector:
    app: device-management
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
