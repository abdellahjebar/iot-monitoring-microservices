# Prediction Service - Kubernetes Manifests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  namespace: iot-monitoring
  labels:
    app: prediction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prediction-service
  template:
    metadata:
      labels:
        app: prediction-service
    spec:
      containers:
      - name: prediction-service
        image: iot-monitoring-microservices-prediction-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8003
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: prediction-service
  namespace: iot-monitoring
spec:
  selector:
    app: prediction-service
  ports:
  - port: 8003
    targetPort: 8003
  type: ClusterIP
