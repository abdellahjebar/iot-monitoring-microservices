# IoT Simulator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-simulator
  namespace: iot-monitoring
  labels:
    app: iot-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-simulator
  template:
    metadata:
      labels:
        app: iot-simulator
    spec:
      containers:
      - name: iot-simulator
        image: iot-monitoring-microservices-simulator:latest
        imagePullPolicy: Never
        env:
        - name: MQTT_BROKER
          value: "mosquitto"
        - name: MQTT_PORT
          value: "1883"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
