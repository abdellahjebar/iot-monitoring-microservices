# Monitoring Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  namespace: iot-monitoring
  labels:
    app: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring
  template:
    metadata:
      labels:
        app: monitoring
    spec:
      containers:
      - name: monitoring
        image: iot-monitoring-microservices-monitoring:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
        env:
        - name: MONGO_HOST
          value: "mongo"
        - name: MONGO_PORT
          value: "27017"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: PREDICTION_SERVICE_URL
          value: "http://prediction-service:8003/predict/anomaly"
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: password
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring
  namespace: iot-monitoring
spec:
  selector:
    app: monitoring
  ports:
  - port: 8002
    targetPort: 8002
  type: ClusterIP
