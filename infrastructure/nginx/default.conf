server {
    listen 80;
    server_name localhost;

    # Frontend Dashboard
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Auth Microservice
    location /auth/ {
        rewrite ^/auth/(.*) /users/$1 break;
        proxy_pass http://auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Device Management Microservice
    location /devices/ {
        rewrite ^/devices/(.*) /devices/$1 break;
        proxy_pass http://device-management:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Monitoring Microservice (Telemetry API)
    location /monitor/ {
        rewrite ^/monitor/(.*) /monitoring/$1 break;
        proxy_pass http://monitoring:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO (Crucial for Real-time Charts)
    location /socket.io/ {
        proxy_pass http://monitoring:8002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
