services:
  backend:
    build:
      context: ./services/signing
      dockerfile: Dockerfile
    container_name: auth-ms
    environment:
      - SERVER_DB=db
      - NAME_DB=${NAME_DB-db_auth}
      - EXPIRE_TIME=1440
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - net-auth
    depends_on:
      - db
      - redis
    command: [ "sh", "-c", "mkdir -p /app/logs && uvicorn main:app --host 0.0.0.0 --port 8000" ]
    restart: on-failure
  simulator:
    build:
      context: ./services/iot-simulator
    container_name: iot-simulator
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    restart: always
    networks:
      - net-auth
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config
      - ./infrastructure/mosquitto/data:/mosquitto/data
      - ./infrastructure/mosquitto/log:/mosquitto/log
    networks:
      - net-auth
  db:
    image: postgres:alpine
    container_name: postgresql
    environment:
      - POSTGRES_USER=${USER_DB-admin}
      - POSTGRES_PASSWORD=${PASSWORD_DB-1234}
    ports:
      - 5432:5432
    networks:
      - net-auth
    volumes:
      - ./services/signing/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - 6379:6379
    networks:
      - net-auth
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_MQTT_DEFAULT_EXCHANGE=iot_events
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - net-auth
    command: [ "sh", "-c", "rabbitmq-plugins enable rabbitmq_mqtt && rabbitmq-server" ]
  device-management:
    build:
      context: ./services/device-management
      dockerfile: Dockerfile
    container_name: device-ms
    environment:
      - SERVER_DB=db
      - NAME_DB=${NAME_DB-db_devices}
      - RABBITMQ_HOST=rabbitmq
    # ports:
    #   - 8001:8001
    networks:
      - net-auth
    depends_on:
      - db
      - rabbitmq
    volumes:
      - ./services/device-management:/app
    command: [ "sh", "-c", "mkdir -p /app/logs && chmod 777 /app/logs && uvicorn main:app --host 0.0.0.0 --port 8001 --reload" ]
    restart: on-failure
  mongo:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD-1234}
    ports:
      - 27017:27017
    networks:
      - net-auth
    volumes:
      - mongo_data:/data/db
  monitoring:
    build:
      context: ./services/monitoring
      dockerfile: Dockerfile
    container_name: monitoring-ms
    environment:
      - MONGO_HOST=mongo
      - RABBITMQ_HOST=rabbitmq
    # ports:
    #   - 8002:8002
    networks:
      - net-auth
    depends_on:
      - mongo
      - rabbitmq
    volumes:
      - ./services/monitoring:/app
    command: [ "sh", "-c", "uvicorn main:app --host 0.0.0.0 --port 8002 --reload" ]
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GATEWAY_URL=/
    container_name: dashboard-ui
    # ports:
    #   - "3000:80"
    depends_on:
      - monitoring
      - device-management
    networks:
      - net-auth
    restart: always

  gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - device-management
      - monitoring
    networks:
      - net-auth
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - net-auth
    restart: always

  grafana:
    image: grafana/grafana
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - net-auth
    depends_on:
      - prometheus
    restart: always

  prediction-service:
    build:
      context: ./services/prediction-service
    container_name: prediction-ms
    ports:
      - "8003:8003"
    networks:
      - net-auth
    restart: on-failure

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - net-auth
    restart: unless-stopped

networks:
  net-auth:
    driver: bridge
volumes:
  mongo_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
