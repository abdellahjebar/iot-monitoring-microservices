services:
  backend:
    build:
      context: ./services/signing
      dockerfile: Dockerfile
    container_name: auth-ms
    environment:
      - SERVER_DB=db
      - NAME_DB=${NAME_DB-db_auth}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - net-auth
    depends_on:
      - db
      - redis
    command: [ "sh", "-c", "mkdir -p /app/logs && chmod 777 /app/logs && uvicorn main:app --host 0.0.0.0 --port 8000" ]
    restart: on-failure
  simulator:
    build:
      context: ./services/iot-simulator
    container_name: iot-simulator
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    restart: always
    networks:
      - net-auth
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config
      - ./infrastructure/mosquitto/data:/mosquitto/data
      - ./infrastructure/mosquitto/log:/mosquitto/log
    networks:
      - net-auth
  db:
    image: postgres:alpine
    container_name: postgresql
    environment:
      - POSTGRES_USER=${USER_DB-admin}
      - POSTGRES_PASSWORD=${PASSWORD_DB-1234}
    ports:
      - 5432:5432
    networks:
      - net-auth
    volumes:
      - ./services/signing/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - 6379:6379
    networks:
      - net-auth
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - net-auth
  device-management:
    build:
      context: ./services/device-management
      dockerfile: Dockerfile
    container_name: device-ms
    environment:
      - SERVER_DB=db
      - NAME_DB=${NAME_DB-db_devices}
      - RABBITMQ_HOST=rabbitmq
    # ports:
    #   - 8001:8001
    networks:
      - net-auth
    depends_on:
      - db
      - rabbitmq
    command: [ "sh", "-c", "mkdir -p /app/logs && chmod 777 /app/logs && uvicorn main:app --host 0.0.0.0 --port 8001" ]
    restart: on-failure
  mongo:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD-1234}
    ports:
      - 27017:27017
    networks:
      - net-auth
    volumes:
      - mongo_data:/data/db
  monitoring:
    build:
      context: ./services/monitoring
      dockerfile: Dockerfile
    container_name: monitoring-ms
    environment:
      - MONGO_HOST=mongo
      - RABBITMQ_HOST=rabbitmq
    # ports:
    #   - 8002:8002
    networks:
      - net-auth
    depends_on:
      - mongo
      - rabbitmq
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    container_name: dashboard-ui
    # ports:
    #   - "3000:80"
    depends_on:
      - monitoring
      - device-management
    networks:
      - net-auth
    restart: always

  gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - device-management
      - monitoring
    networks:
      - net-auth
    restart: always

networks:
  net-auth:
    driver: bridge
volumes:
  mongo_data:
